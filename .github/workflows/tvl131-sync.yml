name: Sync Visual Library 1.3.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, 'run Visual Library 1.3.1 hotfix')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified 1.3.1 patch
        shell: bash
        run: |
          set -euo pipefail
          echo "32a2174fe295500c936fd54d671b2a3895d23c9d8e1e68be5436293f19330018  .transport/tvl131.patch.gz.b64" | sha256sum -c -
          base64 -d .transport/tvl131.patch.gz.b64 > /tmp/tvl131.diff.gz
          gzip -dc /tmp/tvl131.diff.gz > /tmp/tvl131.diff
          patch -p1 < /tmp/tvl131.diff
          git diff --check
      - name: Run checks and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          json.loads(Path('manifest.json').read_text())
          json.loads(Path('locales/en.json').read_text())
          html = Path('ui/panel.html').read_text()
          m = re.search(r'<script>\s*(.*?)\s*</script>\s*$', html, re.S)
          if not m:
              raise SystemExit('No panel script found')
          Path('/tmp/tvl-panel.js').write_text(m.group(1))
          PY
          node --check entry.js
          node --check /tmp/tvl-panel.js
          node tests/campaign-scope.test.cjs
          bash scripts/build.sh
          test -f dist/tavo-visual-library-1.3.1.tpg
      - name: Commit clean hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transport .github/workflows/tvl131-sync.yml
          git config user.name "Hooch88"
          git config user.email "155849308+Hooch88@users.noreply.github.com"
          git add -A
          git commit -m "fix: clarify StoryState campaign controls"
          git push origin main
