name: Export Visual Library source temp

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TEMP_EXPORT_MARKER: visual-library-source-export-v1

jobs:
  export:
    if: contains(github.event.head_commit.message, '[export-source-temp]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          set -euo pipefail
          zip -qr /tmp/tavo-visual-library-source.zip . -x '.git/*' '.github/workflows/export-source-temp.yml'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: tavo-visual-library-source
          path: /tmp/tavo-visual-library-source.zip
          retention-days: 1
