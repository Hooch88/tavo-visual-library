name: Sync Visual Library 1.4.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, 'run Visual Library 1.4.0 sync')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply verified 1.4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/tvl140.part* > /tmp/tvl140.b64
          echo "e30babfd278eba42129e59d2f56e1b82a84ebe025c7cf16c2db5fd0efb9d5aed  /tmp/tvl140.b64" | sha256sum -c -
          base64 -d /tmp/tvl140.b64 > /tmp/tvl140.diff.gz
          gzip -dc /tmp/tvl140.diff.gz > /tmp/tvl140.diff
          patch -p1 < /tmp/tvl140.diff
          git diff --check
      - name: Run checks and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          json.loads(Path('manifest.json').read_text())
          json.loads(Path('locales/en.json').read_text())
          html = Path('ui/panel.html').read_text()
          m = re.search(r'<script>\s*(.*?)\s*</script>\s*$', html, re.S)
          if not m:
              raise SystemExit('No panel script found')
          Path('/tmp/tvl-panel.js').write_text(m.group(1))
          PY
          node --check entry.js
          node --check /tmp/tvl-panel.js
          node tests/campaign-scope.test.cjs
          bash scripts/build.sh
          test -f dist/tavo-visual-library-1.4.0.tpg
      - name: Verify exact 1.4.0 source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { test "$(git hash-object "$1")" = "$2" || { echo "Blob mismatch: $1"; exit 1; }; }
          check_blob manifest.json cc39450de23c28ed575aadbbd38b20e2e9669bd4
          check_blob README.md 9b1e908cec68bd723f3ad9b999e7b656c812a82a
          check_blob CHANGELOG.md bd20ec8cf8c8a0f9ce56b5dc388290622e77de4e
          check_blob tests/campaign-scope.test.cjs b28819f6baeaf01266e7804cd7585fbbb6a4a6f8
          check_blob ui/panel.html 299dcfd5b844f15552d81a7eae99179e797af9e2
          check_blob entry.js 235bcc89225a48a96fc1744ff844776d040e0a81
          check_blob locales/en.json 6ec659ff013a32e398e0aee6821284b70d956df4
      - name: Commit clean Visual Library 1.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transport .github/workflows/tvl140-sync.yml
          git config user.name "Hooch88"
          git config user.email "155849308+Hooch88@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bulk visual library management"
          git push origin main
