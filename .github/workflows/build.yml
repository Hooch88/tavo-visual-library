name: Build Tavo Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest and locale JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('manifest.json').read_text())
          json.loads(Path('locales/en.json').read_text())
          print('JSON validation passed')
          PY

      - name: Validate entry script
        run: node --check entry.js

      - name: Validate panel script
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('ui/panel.html').read_text()
          match = re.search(r'<script>\s*(.*?)\s*</script>\s*$', html, re.S)
          if not match:
              raise SystemExit('No panel script block found')
          Path('/tmp/tvl-panel.js').write_text(match.group(1))
          PY
          node --check /tmp/tvl-panel.js

      - name: Build TPG package
        run: |
          VERSION="$(python -c "import json; print(json.load(open('manifest.json'))['version'])")"
          mkdir -p dist
          zip -r "dist/tavo-visual-library-${VERSION}.tpg" manifest.json entry.js locales ui/panel.html README.md
          sha256sum "dist/tavo-visual-library-${VERSION}.tpg" > "dist/SHA256SUMS.txt"

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: tavo-visual-library
          path: |
            dist/*.tpg
            dist/SHA256SUMS.txt
          if-no-files-found: error
